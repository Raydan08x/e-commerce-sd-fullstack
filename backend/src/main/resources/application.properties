# Configuración general de la aplicación
spring.application.name=e-commerce-sierra-dorada-backend
server.port=${CONTAINER_PORT:8080}
server.forward-headers-strategy=framework

# Conexión local a MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Persistencia con JPA e Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Migraciones SQL versionadas desde data-base/db/migration.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Autenticación mediante JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=36000000
app.jwt.email-verification-expiration-ms=86400000

# Cuenta administrativa principal. No contiene ni reemplaza la contrasena: el
# usuario debe registrarse, verificar este correo e iniciar sesion normalmente.
app.admin.email=${ADMIN_EMAIL:sierradoradacb@gmail.com}

# OpenAPI/Swagger. Tanto la interfaz como el contrato JSON estan protegidos por
# Spring Security y solo aceptan usuarios con ROLE_ADMIN.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
springdoc.packages-to-scan=com.sierra_dorada.controller
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false

# Orígenes autorizados para consumir la API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Integración logística Mi Paquete. La API key nunca se expone al frontend.
app.mipaquete.base-url=${MIPAQUETE_BASE_URL}
app.mipaquete.api-key=${MIPAQUETE_API_KEY:}
app.mipaquete.session-tracker=${MIPAQUETE_SESSION_TRACKER:}
app.mipaquete.origin-country-code=${MIPAQUETE_ORIGIN_COUNTRY_CODE:170}
app.mipaquete.origin-dane-code=${MIPAQUETE_ORIGIN_DANE_CODE:}
app.mipaquete.sender-name=${MIPAQUETE_SENDER_NAME:Sierra Dorada}
app.mipaquete.sender-surname=${MIPAQUETE_SENDER_SURNAME:}
app.mipaquete.sender-email=${MIPAQUETE_SENDER_EMAIL:}
app.mipaquete.sender-phone=${MIPAQUETE_SENDER_PHONE:}
app.mipaquete.sender-document-type=${MIPAQUETE_SENDER_DOCUMENT_TYPE:NIT}
app.mipaquete.sender-document=${MIPAQUETE_SENDER_DOCUMENT:}
app.mipaquete.sender-address=${MIPAQUETE_SENDER_ADDRESS:}
app.mipaquete.user-id=${MIPAQUETE_USER_ID:}
app.mipaquete.request-pickup=${MIPAQUETE_REQUEST_PICKUP:false}
app.mipaquete.forbidden-product=${MIPAQUETE_FORBIDDEN_PRODUCT:false}
app.mipaquete.create-shipment-enabled=${MIPAQUETE_CREATE_SHIPMENT_ENABLED:false}
app.mipaquete.webhook-secret=${MIPAQUETE_WEBHOOK_SECRET:}
app.mipaquete.tracking-url=${MIPAQUETE_TRACKING_URL:https://app.mipaquete.com/seguimiento-envio}

# Firma de integridad de Bold calculada exclusivamente en el backend.
app.bold.secret-key=${BOLD_SECRET_KEY:}
app.bold.currency=${BOLD_CURRENCY:COP}
app.bold.base-url=${BOLD_API_BASE_URL:https://payments.api.bold.co}
app.bold.identity-key=${BOLD_IDENTITY_KEY:9v0NpPhXXDnWItnMs1NZIQhYdXvV9T_Z6ud00VPiMR0}

# Confirmacion obligatoria del correo. MAIL_PASSWORD debe ser una contrasena de
# aplicacion del proveedor, nunca la contrasena normal de la cuenta.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.test-connection=false
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.public-url=${APP_PUBLIC_URL:https://shop.sierradorada.co}
