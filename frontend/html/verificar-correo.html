<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar correo - Sierra Dorada</title>
    <link rel="icon" type="image/png" href="../src/assets/icons/isotipo-dorado-y-blanco.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;600;700&family=Dorsa&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../src/css/navbar.css?v=20260715-4">
    <link rel="stylesheet" href="../src/css/footer.css?v=20260715-1">
    <link rel="stylesheet" href="../src/css/particles.css?v=20260715-3">
    <link rel="stylesheet" href="../src/css/components/Preloader.css">
    <link rel="stylesheet" href="../src/css/admin.css?v=20260810-2">
    <link rel="stylesheet" href="../src/css/typography.css?v=20260715-1">
</head>
<body class="login-body">
    <main class="login-container">
        <section class="login-card correo-verificacion-card">
            <img src="../src/assets/icons/complementario-letrasdoradas.png"
                 alt="Logo Sierra Dorada" class="login-logo">
            <div class="correo-verificacion-icono" aria-hidden="true">
                <i class="bi bi-envelope-check"></i>
            </div>
            <h1>Confirma tu <span>Correo</span></h1>
            <p id="descripcionVerificacion">Estamos validando tu enlace de confirmación.</p>
            <div id="mensajeVerificacion" class="alert alert-info mt-3" role="status" aria-live="polite">
                Verificando…
            </div>
            <form id="formReenvio" class="d-none mt-4" novalidate>
                <label for="emailReenvio" class="form-label">Correo registrado</label>
                <input id="emailReenvio" type="email" class="form-control"
                       placeholder="correo@ejemplo.com" autocomplete="email" required>
                <button type="submit" class="btn btn-dorado w-100 mt-3">
                    <i class="bi bi-send"></i> Reenviar confirmación
                </button>
            </form>
            <a href="login.html" class="btn btn-outline-dorado w-100 mt-3">Volver al inicio de sesión</a>
        </section>
    </main>
    <script type="module" src="../src/js/app.js?v=20260715-10"></script>
    <script type="module" src="../src/js/verificar-correo.js?v=20260810-1"></script>
</body>
</html>
