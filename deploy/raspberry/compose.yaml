name: ecommerce-sd-fullstack

services:
  mysql-local:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${PI_MYSQL_DATABASE:-ecommerce_sd}
      MYSQL_USER: ${PI_MYSQL_USERNAME:-ecommerce}
      MYSQL_PASSWORD: ${PI_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${PI_MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: 640m

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    image: ${BACKEND_IMAGE:-ecommerce-sd-backend:raspberry}
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:-.env.runtime}
    environment:
      CONTAINER_PORT: 8080
    expose:
      - "8080"
    networks:
      - web
      - data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/productos"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    mem_limit: 896m

  frontend:
    build:
      context: ../..
      dockerfile: deploy/raspberry/frontend.Dockerfile
    image: ${FRONTEND_IMAGE:-ecommerce-sd-frontend:raspberry}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SHOP_HTTP_PORT:-3103}:80"
    networks:
      - web
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

networks:
  web:
  data:

volumes:
  mysql_data:
