name: Build and deploy to ECS Express

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecs-deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  CONTAINER_PORT: ${{ secrets.CONTAINER_PORT }}

  ECS_EXECUTION_ROLE: ecsTaskExecutionRole
  ECS_INFRASTRUCTURE_ROLE: ecsInfrastructureRoleForExpressServices

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Ejecutar pruebas del backend
        shell: bash
        run: |
          cd backend
          ./gradlew clean test --no-daemon

      - name: Verificar variables
        shell: bash
        run: |
          if [ -z "$AWS_REGION" ]; then
            echo "Falta configurar el secreto AWS_REGION"
            exit 1
          fi

          if [ -z "$ECS_CLUSTER" ]; then
            echo "Falta configurar el secreto ECS_CLUSTER"
            exit 1
          fi

          if [ -z "$ECS_SERVICE" ]; then
            echo "Falta configurar el secreto ECS_SERVICE"
            exit 1
          fi

          if [ -z "$ECR_REPOSITORY" ]; then
            echo "Falta configurar el secreto ECR_REPOSITORY"
            exit 1
          fi

          if [ -z "$CONTAINER_PORT" ]; then
            echo "Falta configurar el secreto CONTAINER_PORT"
            exit 1
          fi

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Obtener número de cuenta AWS
        id: aws-account
        shell: bash
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y publicar imagen
        id: build-image
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          LATEST_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          echo "Construyendo imagen: $IMAGE_URI"

          for intento in 1 2 3; do
            if docker build \
              --platform linux/amd64 \
              --pull \
              -t "$IMAGE_URI" \
              -t "$LATEST_URI" \
              -f backend/Dockerfile \
              .; then
              break
            fi

            if [ "$intento" -eq 3 ]; then
              echo "No fue posible construir la imagen después de 3 intentos"
              exit 1
            fi

            espera=$((intento * 15))
            echo "La construcción falló. Reintentando en ${espera}s..."
            sleep "$espera"
          done

          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Desplegar en ECS Express
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          image: ${{ steps.build-image.outputs.image }}

          execution-role-arn: arn:aws:iam::${{ steps.aws-account.outputs.id }}:role/${{ env.ECS_EXECUTION_ROLE }}
          infrastructure-role-arn: arn:aws:iam::${{ steps.aws-account.outputs.id }}:role/${{ env.ECS_INFRASTRUCTURE_ROLE }}

          container-port: ${{ env.CONTAINER_PORT }}
          health-check-path: /api/productos

          environment-variables: |
            [
              {
                "name": "DB_URL",
                "value": "${{ secrets.DB_URL }}"
              },
              {
                "name": "DB_USERNAME",
                "value": "${{ secrets.DB_USERNAME }}"
              },
              {
                "name": "DB_PASSWORD",
                "value": "${{ secrets.DB_PASSWORD }}"
              },
              {
                "name": "JWT_SECRET",
                "value": "${{ secrets.JWT_SECRET }}"
              },
              {
                "name": "CORS_ALLOWED_ORIGINS",
                "value": "${{ secrets.CORS_ALLOWED_ORIGINS }}"
              },
              {
                "name": "CONTAINER_PORT",
                "value": "${{ secrets.CONTAINER_PORT }}"
              },
              {
                "name": "BOLD_SECRET_KEY",
                "value": "${{ secrets.BOLD_SECRET_KEY }}"
              },
              {
                "name": "BOLD_CURRENCY",
                "value": "${{ secrets.BOLD_CURRENCY }}"
              },
              {
                "name": "BOLD_IDENTITY_KEY",
                "value": "9v0NpPhXXDnWItnMs1NZIQhYdXvV9T_Z6ud00VPiMR0"
              },
              {
                "name": "MAIL_HOST",
                "value": "${{ secrets.MAIL_HOST }}"
              },
              {
                "name": "MAIL_PORT",
                "value": "${{ secrets.MAIL_PORT }}"
              },
              {
                "name": "MAIL_USERNAME",
                "value": "${{ secrets.MAIL_USERNAME }}"
              },
              {
                "name": "MAIL_PASSWORD",
                "value": "${{ secrets.MAIL_PASSWORD }}"
              },
              {
                "name": "MAIL_FROM",
                "value": "${{ secrets.MAIL_FROM }}"
              },
              {
                "name": "APP_PUBLIC_URL",
                "value": "${{ secrets.APP_PUBLIC_URL }}"
              },
              {
                "name": "MIPAQUETE_BASE_URL",
                "value": "https://api-v2.dev.mpr.mipaquete.com"
              },
              {
                "name": "MIPAQUETE_API_KEY",
                "value": "${{ secrets.MIPAQUETE_API_KEY }}"
              },
              {
                "name": "MIPAQUETE_SESSION_TRACKER",
                "value": "${{ secrets.MIPAQUETE_SESSION_TRACKER }}"
              },
              {
                "name": "MIPAQUETE_ORIGIN_DANE_CODE",
                "value": "${{ secrets.MIPAQUETE_ORIGIN_DANE_CODE }}"
              },
              {
                "name": "MIPAQUETE_ORIGIN_COUNTRY_CODE",
                "value": "${{ secrets.MIPAQUETE_ORIGIN_COUNTRY_CODE }}"
              },
              {
                "name": "MIPAQUETE_REQUEST_PICKUP",
                "value": "${{ secrets.MIPAQUETE_REQUEST_PICKUP }}"
              },
              {
                "name": "MIPAQUETE_FORBIDDEN_PRODUCT",
                "value": "${{ secrets.MIPAQUETE_FORBIDDEN_PRODUCT }}"
              },
              {
                "name": "MIPAQUETE_CREATE_SHIPMENT_ENABLED",
                "value": "false"
              },
              {
                "name": "MIPAQUETE_SENDER_EMAIL",
                "value": "${{ secrets.MIPAQUETE_SENDER_EMAIL }}"
              },
              {
                "name": "MIPAQUETE_SENDER_PHONE",
                "value": "${{ secrets.MIPAQUETE_SENDER_PHONE }}"
              },
              {
                "name": "MIPAQUETE_SENDER_DOCUMENT",
                "value": "${{ secrets.MIPAQUETE_SENDER_DOCUMENT }}"
              },
              {
                "name": "MIPAQUETE_SENDER_DOCUMENT_TYPE",
                "value": "${{ secrets.MIPAQUETE_SENDER_DOCUMENT_TYPE }}"
              },
              {
                "name": "MIPAQUETE_SENDER_NAME",
                "value": "${{ secrets.MIPAQUETE_SENDER_NAME }}"
              },
              {
                "name": "MIPAQUETE_SENDER_SURNAME",
                "value": "${{ secrets.MIPAQUETE_SENDER_SURNAME }}"
              },
              {
                "name": "MIPAQUETE_SENDER_ADDRESS",
                "value": "${{ secrets.MIPAQUETE_SENDER_ADDRESS }}"
              },
              {
                "name": "MIPAQUETE_USER_ID",
                "value": "${{ secrets.MIPAQUETE_USER_ID }}"
              },
              {
                "name": "MIPAQUETE_WEBHOOK_SECRET",
                "value": "${{ secrets.MIPAQUETE_WEBHOOK_SECRET }}"
              }
            ]

      - name: Mostrar información del despliegue
        if: success()
        shell: bash
        run: |
          echo "Despliegue completado correctamente"
          echo "Cluster: $ECS_CLUSTER"
          echo "Servicio: $ECS_SERVICE"
          echo "Repositorio ECR: $ECR_REPOSITORY"
          echo "Imagen: ${{ steps.build-image.outputs.image }}"
