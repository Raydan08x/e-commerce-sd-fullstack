name: Verificación continua

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend y base de datos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Ejecutar pruebas
        working-directory: backend
        run: ./gradlew clean test --no-daemon

  frontend:
    name: Sintaxis frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Revisar módulos JavaScript
        run: find frontend/src/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
